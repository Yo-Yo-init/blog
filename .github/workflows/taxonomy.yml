name: Taxonomy check

# Fails a pull request when a post uses a tag that is not in content/tags.yaml,
# or when the registry itself is inconsistent. Also proves the site still builds.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tags used by posts exist in the registry
        run: python scripts/check_taxonomy.py
      - name: Site builds
        run: python build.py
