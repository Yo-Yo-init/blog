<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <pattern id="dotgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.6" fill="#C9B8A2" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#dotgrid)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- control box on top -->
  <rect x="330" y="60" width="140" height="80" rx="14" stroke="#B5502E" stroke-width="10"/>
  <path d="M 360 92 L 440 92 M 360 116 L 415 116" stroke="#B5502E" stroke-width="8"/>

  <!-- fan-out lines to five agent boxes -->
  <path d="M 355 140 C 240 180 160 200 105 235" stroke="#6E7F5C" stroke-width="8"/>
  <path d="M 385 140 C 330 185 300 205 275 235" stroke="#6E7F5C" stroke-width="8"/>
  <path d="M 400 140 L 400 235" stroke="#6E7F5C" stroke-width="8"/>
  <path d="M 415 140 C 470 185 500 205 525 235" stroke="#6E7F5C" stroke-width="8"/>
  <path d="M 445 140 C 560 180 640 200 695 235" stroke="#6E7F5C" stroke-width="8"/>

  <!-- five agent boxes, each with its own chip -->
  <rect x="55" y="235" width="100" height="90" rx="12" stroke="#B5502E" stroke-width="10"/>
  <rect x="80" y="262" width="50" height="36" rx="6" stroke="#6E7F5C" stroke-width="8"/>

  <rect x="225" y="235" width="100" height="90" rx="12" stroke="#B5502E" stroke-width="10"/>
  <rect x="250" y="262" width="50" height="36" rx="6" stroke="#6E7F5C" stroke-width="8"/>

  <rect x="350" y="235" width="100" height="90" rx="12" stroke="#B5502E" stroke-width="10"/>
  <rect x="375" y="262" width="50" height="36" rx="6" stroke="#6E7F5C" stroke-width="8"/>

  <rect x="475" y="235" width="100" height="90" rx="12" stroke="#B5502E" stroke-width="10"/>
  <rect x="500" y="262" width="50" height="36" rx="6" stroke="#6E7F5C" stroke-width="8"/>

  <rect x="645" y="235" width="100" height="90" rx="12" stroke="#B5502E" stroke-width="10"/>
  <rect x="670" y="262" width="50" height="36" rx="6" stroke="#6E7F5C" stroke-width="8"/>

  <!-- price tag -->
  <path d="M 400 355 L 445 355 L 475 385 L 445 415 L 400 415 Z" stroke="#B5502E" stroke-width="10"/>
  <circle cx="418" cy="385" r="7" stroke="#6E7F5C" stroke-width="8"/>

  </g>
</svg>