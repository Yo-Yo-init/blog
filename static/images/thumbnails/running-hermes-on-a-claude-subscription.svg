<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <pattern id="dotgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.6" fill="#C9B8A2" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#dotgrid)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- Claude Code CLI terminal box -->
  <rect x="80" y="90" width="200" height="120" rx="14" stroke="#B5502E" stroke-width="10"/>
  <path d="M 80 128 L 280 128" stroke="#B5502E" stroke-width="8"/>
  <path d="M 105 158 L 150 158 M 105 182 L 200 182" stroke="#6E7F5C" stroke-width="8"/>

  <!-- Hermes agent box -->
  <rect x="520" y="90" width="200" height="120" rx="14" stroke="#6E7F5C" stroke-width="10"/>
  <path d="M 545 128 L 695 128 M 545 158 L 640 158 M 545 182 L 615 182" stroke="#6E7F5C" stroke-width="8"/>

  <!-- relay arrow between them -->
  <path d="M 290 150 L 505 150" stroke="#B5502E" stroke-width="8"/>
  <path d="M 470 128 L 505 150 L 470 172" stroke="#B5502E" stroke-width="8"/>

  <!-- crossed-out API key: no key needed -->
  <g transform="translate(150 300)">
    <circle cx="0" cy="0" r="24" stroke="#B5502E" stroke-width="9"/>
    <path d="M 24 0 L 110 0 M 88 0 L 88 18 M 108 0 L 108 24" stroke="#B5502E" stroke-width="9"/>
    <path d="M -40 -34 L 44 34" stroke="#B5502E" stroke-width="9"/>
  </g>

  <!-- 5-hour window clock -->
  <g transform="translate(480 310)">
    <circle cx="0" cy="0" r="46" stroke="#6E7F5C" stroke-width="9"/>
    <path d="M 0 0 L 0 -30 M 0 0 L 24 8" stroke="#6E7F5C" stroke-width="9"/>
  </g>

  <!-- fallback arrow looping to a second chip -->
  <path d="M 620 220 C 660 260 640 300 610 340 L 300 340 C 260 340 240 320 240 290" stroke="#6E7F5C" stroke-width="8"/>
  <path d="M 220 310 L 240 290 L 258 312" stroke="#6E7F5C" stroke-width="8"/>
  <rect x="360" y="378" width="110" height="52" rx="10" stroke="#6E7F5C" stroke-width="9"/>

  </g>
</svg>
