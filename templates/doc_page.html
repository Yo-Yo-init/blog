{% extends "base.html" %}

{% block content %}
<div class="docs-layout">
    <!-- Sidebar -->
    <aside class="docs-sidebar">
        <h2 class="sidebar-title">Documentation</h2>
        <nav class="sidebar-nav">
            {% for doc in docs %}
            <a href="/docs/{{ doc.slug }}"
                class="sidebar-link {% if current and current.slug == doc.slug %}active{% endif %}">
                {{ doc.title }}
            </a>
            {% endfor %}
        </nav>
    </aside>

    <!-- Main content -->
    <section class="docs-content">
        {% if current %}
        <h1>{{ current.title }}</h1>
        <div class="prose">
            {{ current.content_html | safe }}
        </div>
        {% else %}
        <p class="empty-state">No documentation pages yet.</p>
        {% endif %}
    </section>
</div>
{% endblock %}
