<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ page_title }} — {{ site_name }}{% endblock %}</title>
    <meta name="description" content="{% block meta_desc %}{{ site_description }}{% endblock %}" />
    <meta name="author" content="{{ site_author }}" />

    <!-- Open Graph -->
    <meta property="og:title" content="{{ page_title }} — {{ site_name }}" />
    <meta property="og:description" content="{{ site_description }}" />
    <meta property="og:type" content="website" />

    <!-- Styles (system font stack — no external font requests) -->
    <link rel="stylesheet" href="/static/css/style.css?v=7" />

    <!-- Inline script to prevent flash of wrong theme -->
    <script>
        (function () {
            var t = localStorage.getItem("theme");
            if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="site-logo">
                <img src="/static/images/avatar.png" alt="" class="header-avatar" />
                <span class="site-logo-text">{{ site_name }}</span>
            </a>

            <nav class="site-nav">
                <a href="/" class="nav-home">Home</a>
                <a href="/blog">Blog</a>
                <a href="/docs">Docs</a>
                <a href="/about">About</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="theme-icon"></span>
                </button>
            </nav>
        </div>
    </header>

    <main class="site-main{% if main_class %} {{ main_class }}{% endif %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p class="footer-copy">&copy; {{ site_name }}</p>
            <nav class="footer-links">
                <a href="https://github.com/Yo-Yo-init" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com/in/dominic-pepper/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://www.youtube.com/watch?v=3BFTio5296w" target="_blank" rel="noopener">YouTube</a>
            </nav>
        </div>
    </footer>

    <script src="/static/js/theme.js"></script>
</body>

</html>
