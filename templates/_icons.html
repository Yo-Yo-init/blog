{% macro icon(name) %}
{% if name == "server" %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="3" width="20" height="7" rx="1.5"/>
  <rect x="2" y="14" width="20" height="7" rx="1.5"/>
  <circle cx="6.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/>
  <circle cx="6.5" cy="17.5" r="0.6" fill="currentColor" stroke="none"/>
</svg>
{% elif name == "gamepad" %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="8" width="20" height="10" rx="5"/>
  <line x1="7" y1="11" x2="7" y2="15"/>
  <line x1="5" y1="13" x2="9" y2="13"/>
  <circle cx="16" cy="12" r="0.8" fill="currentColor" stroke="none"/>
  <circle cx="18" cy="15" r="0.8" fill="currentColor" stroke="none"/>
</svg>
{% elif name == "certificate" %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="8" r="5"/>
  <path d="M9 12.5 7 21l5-3 5 3-2-8.5"/>
</svg>
{% elif name == "feather" %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 20h9"/>
  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
</svg>
{% endif %}
{% endmacro %}
